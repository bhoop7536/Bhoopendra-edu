<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formal vs Informal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* Background image + gradient */
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('your-image.jpg') no-repeat center center/cover;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: #ffcc00;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.2);
    }

    table, th, td {
      border: 1px solid white;
    }

    th, td {
      padding: 12px;
      text-align: center;
    }

    th {
      background: #ffcc00;
      color: black;
    }

    a {
      color: #ffcc00;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: #fff;
    }

    .back {
      text-align: left;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="back">
      <a href="vocabulary.html">⬅ BACK</a>
    </div>
    <h1 style="font-size: 60px; color: lightblue; text-align: center;">
  Formal vs Informal English
</h1>

    <table>
      <tr>
        <th>Formal</th>
        <th>Informal</th>
      </tr>
      <tr>
        <td>I am writing to inform you…</td>
        <td>Just to let you know…</td>
      </tr>
      <tr>
        <td>Could you please…</td>
        <td>Can you…</td>
      </tr>
      <tr>
        <td>I would like to…</td>
        <td>I want to…</td>
      </tr>
      <tr>
        <td>Thank you for your assistance.</td>
        <td>Thanks a lot.</td>
      </tr>
      <tr>
        <td>I apologize for the inconvenience.</td>
        <td>Sorry about that.</td>
      </tr>
    </table>
  </div>
</body>
</html>
