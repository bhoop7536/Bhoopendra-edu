<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic Details</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#08263a);
  color:white;
  padding:40px;
}
.box{
  max-width:800px;
  margin:auto;
  background:rgba(255,255,255,0.05);
  padding:30px;
  border-radius:12px;
}
a.btn{
  display:inline-block;
  margin-top:20px;
  padding:10px 16px;
  background:linear-gradient(90deg,#7c3aed,#06b6d4);
  color:black;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h1 id="title">Loading...</h1>
<p id="desc"></p>

<a href="reading-writing.html" class="btn">⬅ Back</a>
</div>

<script>

const topics = {

rc:{
title:"Reading Comprehension",
desc:"Practice long and short passages with questions on main idea, tone, vocabulary, and inference."
},

pc:{
title:"Passage Completion",
desc:"Complete missing lines in passages — tests coherence and vocabulary in context."
},

ct:{
title:"Cloze Test",
desc:"Multiple blanks in a passage; select the best word for each blank."
},

sr:{
title:"Sentence Rearrangement / Para Jumbles",
desc:"Reorder sentences to form a coherent paragraph."
},

syn:{
title:"Synonyms & Antonyms in Context",
desc:"Practice words with contextual synonyms and antonyms."
},

inf:{
title:"Inference Based Questions",
desc:"Questions that require reading between the lines."
},

fv:{
title:"Fact vs Opinion",
desc:"Differentiate statements of fact from subjective opinion."
},

cr:{
title:"Critical Reading",
desc:"Analyze arguments, assumptions and evaluate evidence."
},

ew:{
title:"Essay Writing",
desc:"Structure, thesis, introduction-body-conclusion and practice prompts."
},

lw:{
title:"Letter Writing",
desc:"Formats for formal letters, applications and informal letters."
},

rw:{
title:"Report Writing",
desc:"How to write clear and concise reports."
},

nw:{
title:"Notice Writing",
desc:"Short public notices: format and examples."
},

aw:{
title:"Article Writing",
desc:"Structure of articles and conclusion writing."
},

sw:{
title:"Story Writing",
desc:"Plot, character, setting and dialogues."
},

pw:{
title:"Precis Writing",
desc:"Shortening long passages while keeping main ideas intact."
},

dw:{
title:"Dialogue Writing",
desc:"Writing realistic dialogues for plays and stories."
}

};


// URL se id lena
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(topics[id]){
document.getElementById("title").innerText = topics[id].title;
document.getElementById("desc").innerText = topics[id].desc;
}else{
document.getElementById("title").innerText="Topic not found";
}

</script>

</body>
</html>
