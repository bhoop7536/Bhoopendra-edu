<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reading & Writing — Topic Cards</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
--bg1: linear-gradient(135deg,#0f172a 0%,#0b2545 50%, #05243a 100%);
--accent: linear-gradient(90deg,#7c3aed,#06b6d4);
--glass-border: rgba(255,255,255,0.08);
}
*{box-sizing:border-box}
body{margin:0;padding:32px;font-family:Inter;background:var(--bg1);color:#e6eef8}
.container{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;margin-bottom:20px}
.title{display:flex;gap:14px;align-items:center}
.logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#7c3aed);display:grid;place-items:center;font-weight:800;color:#021124;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:22px}

.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.06);
padding:18px;border-radius:14px;
cursor:pointer;display:flex;flex-direction:column;gap:10px;
}
.card:hover{transform:translateY(-6px)}

.kicker{font-size:12px}
.link-row{margin-top:auto;display:flex;justify-content:space-between}
.link-btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);text-decoration:none;color:white;font-weight:600}
.link-btn.primary{background:var(--accent);color:#021124;border:0}
</style>
</head>

<body>

<div class="container">

<header>
<div class="title">
<div class="logo">RW</div>
<div>
<h1>Reading & Writing — Topic Cards</h1>
<p>Select a card to view short description and quick links for practice.</p>
</div>
</div>
</header>

<div id="grid" class="grid"></div>

</div>

<script>

const topics = [
{id:'rc',type:'Reading',title:'Reading Comprehension',desc:'Practice long and short passages with questions on main idea, tone, vocabulary, and inference.',links:[{t:'Practice Passage',url:'#'}]},
{id:'pc',type:'Reading',title:'Passage Completion',desc:'Complete missing lines in passages — tests coherence and vocabulary in context.',links:[{t:'Try Exercises',url:'#'}]},
{id:'ct',type:'Reading',title:'Cloze Test',desc:'Multiple blanks in a passage; select the best word for each blank.',links:[{t:'Cloze Tests',url:'#'}]},
{id:'sr',type:'Reading',title:'Sentence Rearrangement / Para Jumbles',desc:'Reorder sentences to form a coherent paragraph.',links:[{t:'Para Jumbles',url:'#'}]},
{id:'syn',type:'Reading',title:'Synonyms & Antonyms in Context',desc:'Practice words with contextual synonyms and antonyms.',links:[{t:'Word Lists',url:'#'}]},
{id:'inf',type:'Reading',title:'Inference Based Questions',desc:'Questions that require reading between the lines.',links:[{t:'Inference Drills',url:'#'}]},
{id:'fv',type:'Reading',title:'Fact vs Opinion',desc:'Differentiate statements of fact from subjective opinion.',links:[{t:'Exercises',url:'#'}]},
{id:'cr',type:'Reading',title:'Critical Reading',desc:'Analyze arguments, assumptions and evaluate evidence.',links:[{t:'Critical Passages',url:'#'}]}
];

const grid=document.getElementById('grid');

function render(){
grid.innerHTML='';

topics.forEach(t=>{

const el=document.createElement('article');
el.className='card';

el.innerHTML=`
<span class="kicker">${t.type}</span>
<h3>${t.title}</h3>
<p>${t.desc}</p>

<div class="link-row">
<div>ID: ${t.id}</div>

<div>
<a class="link-btn" href="${t.id}.html" onclick="event.stopPropagation()">Details</a>
<a class="link-btn primary" href="${t.links[0].url}" onclick="event.stopPropagation()">Practice</a>
</div>

</div>
`;

el.addEventListener('click',(e)=>{
if(e.target.tagName!=="A"){
window.open("details.html?id="+t.id,"_blank");
}
});

grid.appendChild(el);

});

}

render();

</script>

</body>
</html>
