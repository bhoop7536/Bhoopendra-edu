<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Use Vocabulary</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 36px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    th, td {
      padding: 12px 18px;
      text-align: center;
      font-size: 16px;
    }
    th {
      background: #4a90e2;
      color: white;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tr:nth-child(even) {
      background-color: #f2f6fc;
    }
    tr:hover {
      background-color: #d6e4f0;
      transition: 0.3s;
      transform: scale(1.01);
    }
  </style>
</head>
<body>
  <h1>Daily Use Vocabulary</h1>
  <table>
    <tr>
      <th>S.No.</th>
      <th>Word</th>
      <th>Meaning (Hindi)</th>
      <th>Example</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Hello</td>
      <td>नमस्ते</td>
      <td>Hello, how are you?</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Food</td>
      <td>भोजन</td>
      <td>I like Indian food.</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Water</td>
      <td>पानी</td>
      <td>Please give me some water.</td>
    </tr>
    <tr>
      <td>4</td>
      <td>Friend</td>
      <td>दोस्त</td>
      <td>Ravi is my best friend.</td>
    </tr>
    <tr>
      <td>5</td>
      <td>Book</td>
      <td>किताब</td>
      <td>I am reading a book.</td>
    </tr>
  </table>
</body>
</html>
