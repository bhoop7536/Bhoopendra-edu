<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Vocabulary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f8ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    input, select {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      margin: 0;
      color: #0066cc;
    }
    .card p {
      margin: 5px 0 0;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>📘 Business Vocabulary</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Search... (खोजें)">
    <select id="levelFilter">
      <option value="all">All</option>
      <option value="basic">Basic</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
  </div>

  <div id="grid"></div>

  <!-- ✅ Final Script -->
  <script>
    const vocab = [
      // Basic vocabulary
      {en:'Business', hi:'व्यापार / व्यवसाय', level:'basic'},
      {en:'Profit', hi:'लाभ', level:'basic'},
      {en:'Loss', hi:'हानि', level:'basic'},
      {en:'Customer', hi:'ग्राहक', level:'basic'},
    
{en:'Supplier', hi:'आपूर्तिकर्ता', level:'basic'},
{en:'Revenue', hi:'आय', level:'basic'},
{en:'Expense', hi:'खर्च', level:'basic'},
{en:'Market', hi:'बाजार', level:'basic'},
{en:'Price', hi:'मूल्य', level:'basic'},
{en:'Product', hi:'उत्पाद', level:'basic'},
{en:'Service', hi:'सेवा', level:'basic'},
{en:'Company', hi:'कंपनी / संस्था', level:'basic'},
{en:'Employee', hi:'कर्मचारी', level:'basic'},
{en:'Employer', hi:'नियोक्ता', level:'basic'},
{en:'Salary', hi:'वेतन', level:'basic'},
      // ... बाकी शब्द ...

      // Intermediate vocabulary
      {en:'Turnover', hi:'कारोबार / कुल बिक्री', level:'intermediate'},
      {en:'Investment', hi:'निवेश', level:'intermediate'},
      {en:'Capital', hi:'पूंजी', level:'intermediate'},
      {en:'Share', hi:'शेयर / हिस्सा', level:'intermediate'},
{en:'Stock Market', hi:'शेयर बाजार', level:'intermediate'},
{en:'Partnership', hi:'साझेदारी', level:'intermediate'},
{en:'Entrepreneur', hi:'उद्यमी', level:'intermediate'},
{en:'Startup', hi:'नया व्यवसाय', level:'intermediate'},
{en:'Negotiation', hi:'सौदेबाज़ी', level:'intermediate'},
{en:'Contract', hi:'अनुबंध', level:'intermediate'},
{en:'Brand', hi:'ब्रांड / नाम', level:'intermediate'},
{en:'Consumer', hi:'उपभोक्ता', level:'intermediate'},
{en:'Strategy', hi:'रणनीति', level:'intermediate'},
{en:'Competition', hi:'प्रतिस्पर्धा', level:'intermediate'},
{en:'Growth', hi:'वृद्धि', level:'intermediate'},
      // ... बाकी intermediate ...

      // Advanced vocabulary
     {en:'Merger', hi:'विलय (दो कंपनियों का मिलना)', level:'advanced'},
{en:'Acquisition', hi:'अधिग्रहण (एक कंपनी का दूसरी को खरीदना)', level:'advanced'},
{en:'Equity', hi:'इक्विटी / स्वामित्व पूंजी', level:'advanced'},
{en:'Liability', hi:'देयता / ऋण', level:'advanced'},
{en:'Assets', hi:'संपत्ति', level:'advanced'},
{en:'ROI (Return on Investment)', hi:'निवेश पर प्रतिफल', level:'advanced'},
{en:'Cash Flow', hi:'नकद प्रवाह', level:'advanced'},
{en:'Monopoly', hi:'एकाधिकार', level:'advanced'},
{en:'Outsourcing', hi:'बाहरी सेवाएँ लेना', level:'advanced'},
{en:'Franchise', hi:'फ्रेंचाइज़ / शाखा अधिकार', level:'advanced'},
{en:'Supply Chain', hi:'आपूर्ति श्रृंखला', level:'advanced'},
{en:'Risk Management', hi:'जोखिम प्रबंधन', level:'advanced'},
{en:'Human Resources (HR)', hi:'मानव संसाधन विभाग', level:'advanced'},
{en:'Corporate Social Responsibility (CSR)', hi:'कॉर्पोरेट सामाजिक ज़िम्मेदारी', level:'advanced'},
{en:'Globalization', hi:'वैश्वीकरण', level:'advanced'}
      // ... बाकी advanced ...
    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const levelFilter = document.getElementById('levelFilter');

    // Function to render vocab cards
    function renderVocab() {
      const searchText = searchInput.value.toLowerCase();
      const selectedLevel = levelFilter.value;

      grid.innerHTML = ''; // साफ करें

      vocab
        .filter(item => {
          // search filter
          const matchSearch =
            item.en.toLowerCase().includes(searchText) ||
            item.hi.toLowerCase().includes(searchText);

          // level filter
          const matchLevel = selectedLevel === 'all' || item.level === selectedLevel;

          return matchSearch && matchLevel;
        })
        .forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<h3>${item.en}</h3><p>${item.hi}</p>`;
          grid.appendChild(card);
        });
    }

    // Event listeners
    searchInput.addEventListener('input', renderVocab);
    levelFilter.addEventListener('change', renderVocab);

    // पहली बार render
    renderVocab();
  </script>

</body>
</html>
